<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Entrenador gratuito para el examen onSET-Deutsch: C-Tests, simulacros, clases de gramática y tests.">
<title>OnSet trainer: entrenador onSET-Deutsch</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span class="titlebar-text"><span class="titlebar-icon" aria-hidden="true"></span>OnSet trainer</span>
    <span class="titlebar-controls" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span>
  </header>
  <nav class="side" aria-label="Secciones">
    <div class="brand">OnSet trainer<span>Entrenador onSET-Deutsch</span></div>
    <div id="navSide"></div>
    <div class="foot">
      <p id="syncNote">Tu progreso se guarda en este navegador.</p>
      <p class="footlinks"><button id="exportBtn">Exportar progreso</button> <button id="importBtn">Importar</button></p>
      <button id="resetBtn">Borrar mi progreso</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="bottom" id="navBottom" aria-label="Secciones"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data/texts.js"></script>
<script src="js/data/lessons.js"></script>
<script src="js/data/vocabulary.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/generators.js"></script>
<script src="js/core/ctest.js"></script>
<script src="js/data/drills.js"></script>
<script src="js/data/plan.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/simulacro.js"></script>
<script src="js/views/practice.js"></script>
<script src="js/views/grammar.js"></script>
<script src="js/views/quiz.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/custom.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
