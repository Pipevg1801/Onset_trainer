const PNOM = {ich:["ich",0,"yo"],du:["du",1,"tú"],er:["er",2,"él"],sie:["sie",2,"ella"],wir:["wir",3,"nosotros"],ihr:["ihr",4,"ustedes, informal"],sie3:["sie",5,"ellos"],Sie:["Sie",5,"usted, formal"]};
function artQuizItem(){
  const c = rnd(["nom","akk","akk","dat","dat","gen"]);
  const it = npItem(c,false,true); if(!it) return null;
  const fam = it.dt==="def" ? ["der","die","das","den","dem","des"] : ["","e","en","em","er","es"].map(e=>STEM[it.dt]+e);
  const raw = it.detRaw, fix = o => it.start ? cap(o) : o;
  const opts = [raw, ...shuffle(fam.filter(f=>f!==raw)).slice(0,3)].map(fix);
  return {pre:it.before, post:it.post, options:shuffle(opts), ans:fix(raw), cue:null, expl:it.expl, c};
}
function pronQuizItem(){
  const c = rnd(["nom","akk","akk","dat","dat"]);
  let pre, post, p, form, cue, r;
  if(c==="nom"){
    p = rnd(PRON); const [f,idx,cueN] = PNOM[p.k]; const v = rnd(VERBS.filter(x=>!x.p));
    pre = rnd(["Heute","Jetzt","Morgen früh"])+" "+v.f[idx]+" "; post = " "+v.c+"."; form = f; cue = cueN; r = `es el sujeto del verbo «${v.i}»`;
  } else {
    const tp = rnd(PTPL.filter(x=>x.c===c)); p = rnd(PRON.filter(x=>!tp.x.includes(x.k)));
    [pre, post] = tp.t.split("{PR}"); form = p[c]; cue = p.es; r = tp.r;

  const others = shuffle(PRON.filter(x=>x.k!==p.k)).map(x=> c==="nom" ? PNOM[x.k][0] : x[c]);
  const set = [form]; for(const o of own.concat(others)) if(!set.includes(o) && set.length<4) set.push(o);
  return {pre, post, options:shuffle(set), ans:form, cue, expl:`${CASE_ES[c]}. ${sent(r)} «${cue}» → ${form}.`, c};
}

   SIMULACRO FÁCIL: cada hueco con 3 opciones
   ========================================================= */
let VOCAB = null;
function vocab(){ if(VOCAB) return VOCAB; const set=new Set(); TEXTS.forEach(t=>(t.text.match(/[A-Za-zÄÖÜäöüßÀ-ÿ]+/g)||[]).forEach(w=>{ if(w.length>1) set.add(w); })); VOCAB=[...set]; return VOCAB; }
const ENDS = ["ern","ten","en","er","em","es","st","et","te","e","n","s","t"];
function choicesFor(g){
  const w=g.full, p=g.prefix;
  const real = vocab().filter(v=>v!==w && v.startsWith(p) && v.length>p.length && Math.abs(v.length-w.length)<=3);
  const morph = [], noun = /^[A-ZÄÖÜ]/.test(w);
  const E1 = noun ? ["en","es","er","e","n","s"] : ENDS, E2s = noun ? ["","e","en","n","s","er"] : ["e","en","er","em","es","t","st","et","te","n"];
  for(const E of E1){ if(!w.endsWith(E)) continue; const stem=w.slice(0,-E.length); if(stem.length<p.length) continue; for(const E2 of E2s){ if(E2===E) continue; if(E2==="n" && !/[e]$|el$|er$/.test(stem)) continue; if(E2==="en" && /e$/.test(stem)) continue; morph.push(stem+E2); } break; }
  if(!noun){ morph.push(w+"e", w+"n"); } if(w.length-1>p.length) morph.push(w.slice(0,-1));
  const ok = x => x!==w && x.startsWith(p) && x.length>p.length && x.length>2 && !/e{2}[a-z]?$|nnn|sss|(.)\1\1/.test(x);
  const out=[w], take = arr => { const c=shuffle([...new Set(arr)].filter(x=>ok(x)&&!out.includes(x))); if(c.length){ out.push(c[0]); return true; } return false; };
  if(real.length>=2 && Math.random()<0.7){ take(real); take(real); } else { take(real); }
  while(out.length<3 && take(morph.concat(real))){}
  let k=0; while(out.length<3){ k++; out.push(p+"e".repeat(k)+"n"); }
  return shuffle(out);
}
function choiceSpan(p, a){
  if(a===p.full) return `<span class="gapw ok"><b>${esc(p.full)}</b></span>`;
  return `<span class="gapw bad"><s>${esc(a||"sin respuesta")}</s> <b>${esc(p.full)}</b></span>`;
}
function renderChoiceCTest(parts, opts, answers){

}

    const ctx = e.ctx || e.full; const k = ctx.indexOf(e.full);
    const before = k>=0?ctx.slice(0,k):"", after = k>=0?ctx.slice(k+e.full.length):"";
    if(!s.checked){ const w=e.prefix.length+1; return `<div class="drill-item">${esc(before)}<span class="gapw">${esc(e.prefix)}<input data-gap="${i}" aria-label="Palabra ${i+1}" maxlength="${w}" style="width:${w+0.6}ch" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.answers[i]||"")}"></span>${esc(after)}</div>`; }
    const v=(s.answers[i]||"").trim(), good=v===e.ans; if(good) ok++;
    return `<div class="drill-item">${esc(before)}<span class="gapw ${good?"ok":"bad"}">${esc(e.prefix)}${!good&&v?`<s>${esc(v)}</s>`:""}<b>${esc(e.ans)}</b></span>${esc(after)}</div>`;
  }).join("");
  m.innerHTML = `<article class="sheet"><div class="meta"><h2>Repaso</h2><span class="small muted">${s.items.length} palabras</span></div>
   ${rows}
   ${s.checked?`<div class="score"><span class="big">${ok}/${s.items.length}</span><span class="badge ${grade(pct(ok,s.items.length)).c}">${grade(pct(ok,s.items.length)).t}</span><span class="muted">+${ok} puntos</span></div><div class="row"><button class="btn" id="back">Volver al repaso</button></div>`
   :umlautBar()+`<div class="row" style="margin-top:14px"><button class="btn" id="check">Comprobar</button><button class="btn ghost" id="back">Salir</button></div>`}</article>`;
  const c=$("#check"); if(c) c.onclick=()=>{
    s.answers=readAnswers(); s.checked=true; let good=0;
    s.items.forEach((e,i)=>{ const ref=S.errors.find(x=>x.full===e.full&&x.prefix===e.prefix); if(!ref) return; if((s.answers[i]||"").trim()===e.ans){ good++; ref.hits++; } else { ref.hits=0; ref.count++; } });
    S.errors = S.errors.filter(x=>x.hits<2);
    S.xp+=good;
    S.history.push({type:"review",label:"Repaso de errores",level:"Rep.",correct:good,total:s.items.length,date:new Date().toISOString()});
    markDay(); save(); render();
  };
  const b=$("#back"); if(b) b.onclick=()=>{ session=null; render(); };
}

/* =========================================================
   MI TEXTO: convierte cualquier texto en un C-Test
   ========================================================= */
function vCustom(m){
  if(session && session.kind==="text" && session.type==="custom") return textSession(m);
  m.innerHTML = `<h1>Crea tu propio C-Test</h1>
  <p class="lede">Pega un texto en alemán (una noticia, un párrafo de un libro, un artículo de tu carrera). La primera y la última oración quedan completas y se crean 20 huecos con el mismo método del onSET.</p>
  <section class="panel">
    <label for="ctitle" class="small" style="font-weight:700">Título</label>
    <input id="ctitle" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 14px;background:var(--surface)" placeholder="Por ejemplo: Nachricht vom Montag">
    <label for="ctext" class="small" style="font-weight:700">Texto en alemán</label>
    <textarea id="ctext" style="margin-top:6px" placeholder="Pega aquí al menos 4 o 5 oraciones (unas 80 palabras)."></textarea>
    <p class="small muted" id="cmsg"></p>
    <button class="btn" id="mk">Crear C-Test</button>
  </section>
  ${S.custom.length?`<section class="panel" style="margin-top:18px"><h2>Tus textos</h2><div class="tlist">${S.custom.map((c,i)=>`<button class="tcard" data-cust="${i}"><span class="t">${esc(c.title)}</span><span class="small muted">${c.best!=null?"Mejor: "+c.best+"/"+c.n:"Sin hacer"}</span></button>`).join("")}</div></section>`:""}`;
  $("#mk").onclick=()=>{
    const txt=$("#ctext").value.trim(), title=$("#ctitle").value.trim()||"Mi texto";
    const parts=buildCTest(txt); const n=gapCount(parts);
    if(splitSentences(txt).length<3 || n<8){ $("#cmsg").textContent="El texto es demasiado corto. Añade más oraciones para poder crear al menos 8 huecos."; return; }
    S.custom.unshift({title,text:txt,n}); S.custom=S.custom.slice(0,12); save();
    openText({id:"c-"+Date.now(),level:"Propio",title,text:txt,ci:0},"custom");
  };
  m.querySelectorAll("[data-cust]").forEach(b=>b.onclick=()=>{ const c=S.custom[+b.dataset.cust]; openText({id:"c",level:"Propio",title:c.title,text:c.text,ci:+b.dataset.cust},"custom"); });
}

/* =========================================================
   PLAN de 4 semanas
   ========================================================= */
function vPlan(m){
  const all = PLAN.flatMap(w=>w.tasks), done = all.filter(t=>S.plan[t[0]]).length;
  m.innerHTML = `<h1>Plan de 4 semanas</h1>
  <p class="lede">Unas 2 o 3 horas al día. Marca cada tarea al terminarla; el plan prioriza lo que da puntos en el onSET: terminaciones, palabras frecuentes y velocidad de lectura.</p>
  <div class="row" style="margin-bottom:22px"><div class="bar" style="flex:1;max-width:420px"><i style="width:${pct(done,all.length)}%"></i></div><span class="small"><b>${done}</b> de ${all.length} tareas</span></div>
  ${PLAN.map(w=>`<section class="panel week"><h2>${w.w}: ${esc(w.title)}</h2><ul class="tasks">${w.tasks.map(([id,txt,v])=>`<li class="${S.plan[id]?"done":""}"><input type="checkbox" id="${id}" data-task="${id}" ${S.plan[id]?"checked":""}><span><label for="${id}">${esc(txt)}</label>${v?` <button class="btn ghost small" style="margin-left:6px;padding:2px 10px" data-view="${v}">Abrir</button>`:""}</span></li>`).join("")}</ul></section>`).join("")}`;
  m.querySelectorAll("[data-task]").forEach(cb=>cb.onchange=()=>{ S.plan[cb.dataset.task]=cb.checked; if(cb.checked){ S.xp+=3; markDay(); toast("+3 puntos"); } save(); render(); });
}

/* =========================================================
   EVENTOS GLOBALES
   ========================================================= */
let lastInput = null;
document.addEventListener("focusin", e=>{ if(e.target.matches("input[data-gap]")) lastInput=e.target; });
document.addEventListener("mousedown", e=>{ if(e.target.closest(".umlauts button")) e.preventDefault(); });
document.addEventListener("click", e=>{
  const u = e.target.closest(".umlauts button");
  if(u){ const inp = lastInput && document.body.contains(lastInput) ? lastInput : document.querySelector("input[data-gap]"); if(!inp) return;
    const ch=u.dataset.ch, s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    if(inp.value.length - (en-s) >= inp.maxLength) return;
    inp.value = inp.value.slice(0,s)+ch+inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); return; }
  const v = e.target.closest("[data-view]");
  if(v){ go(v.dataset.view); return; }
});
document.addEventListener("change", e=>{ if(e.target.matches("select.choice")) easyChoose(e.target); });
document.addEventListener("keydown", e=>{
  if(view==="quiz" && session && session.kind==="quiz" && !session.done && !e.target.matches("input,textarea,select")){
    if(/^[1-4]$/.test(e.key)){ quizPick(+e.key-1); return; }
    if(e.key==="Enter" && session.picked[session.i]!==undefined){ e.preventDefault(); quizNext(); return; }
  }
  if(e.key==="Enter" && e.target.matches("input[data-gap]")){
    e.preventDefault();
    const all=[...document.querySelectorAll("input[data-gap]")]; const i=all.indexOf(e.target);
    if(all[i+1]) all[i+1].focus(); else { const c=$("#check")||$("#nextText"); if(c) c.focus(); }
  }
});
$("#resetBtn").onclick=()=>{ if(confirm("¿Borrar todo tu progreso? Esto no se puede deshacer.")){ S=blank(); save(); go("dash"); toast("Progreso borrado"); } };

loadLocal();
render();
initRemote();
</script>
